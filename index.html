<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestuuu 💖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6ea 0%, #ffc0cb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        .tag {
            background-color: #ffe4e6;
            color: #e11d48;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .heart-icon {
            font-size: 80px;
            margin: 15px 0;
            display: block;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tap-text {
            color: #be123c;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .content-section {
            display: none;
        }

        .content-section h1 {
            color: #e11d48;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .content-section p {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
            margin-top: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .yes-btn {
            background-color: #22c55e;
            color: white;
        }

        .no-btn {
            background-color: #ef4444;
            color: white;
            position: relative;
        }

        .final-screen {
            display: none;
        }

        .final-screen h2 {
            color: #22c55e;
            font-size: 22px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Cover View -->
        <div id="coverSection" onclick="openEnvelope()">
            <div class="tag">Bestuuu</div>
            <div class="heart-icon">💖</div>
            <div class="tap-text">Tap anywhere to open 💖</div>
        </div>

        <!-- Apology View -->
        <div id="apologySection" class="content-section">
            <div class="tag">I'm Sorry! 🥺</div>
            <h1>Please Forgive Me?</h1>
            <p>I really value our friendship and I'm truly sorry for messing up. Can we make up?</p>
            <div class="btn-container">
                <button class="yes-btn" onclick="forgive()">Yes ❤️</button>
                <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 💔</button>
            </div>
        </div>

        <!-- Success View -->
        <div id="successSection" class="final-screen">
            <div class="heart-icon">🎉</div>
            <h2>Yay! Thank You!</h2>
            <p>Best friends forever! 🤗✨</p>
        </div>
    </div>

    <script>
        function openEnvelope() {
            document.getElementById('coverSection').style.display = 'none';
            document.getElementById('apologySection').style.display = 'block';
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = Math.max(20, x) + 'px';
            noBtn.style.top = Math.max(20, y) + 'px';
        }

        function forgive() {
            document.getElementById('apologySection').style.display = 'none';
            document.getElementById('successSection').style.display = 'block';
        }
    </script>
</body>
</html>
